{% extends "layouts/base.html" %}
{% block title %}Students By City{% endblock title %}

{% block content %}
<h2>Number of Students in Each City</h2>

<table border="1" cellpadding="8">
  <tr>
    <th>City</th>
    <th># Students</th>
  </tr>
  {% for r in rows %}
    <tr>
      <td>{{ r.city }}</td>
      <td>{{ r.num_students }}</td>
    </tr>
  {% empty %}
    <tr><td colspan="2">No data</td></tr>
  {% endfor %}
</table>
{% endblock content %}
