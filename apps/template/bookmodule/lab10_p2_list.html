{% extends "layouts/base.html" %}
{% block content %}
<h2>Part 2 - List Books (Django Forms)</h2>

<p><a href="{% url 'p2_addbook' %}">Add New Book</a></p>

<table border="1" cellpadding="8">
  <tr>
    <th>ID</th><th>Title</th><th>Author</th><th>Price</th><th>Edition</th><th>Actions</th>
  </tr>
  {% for b in books %}
    <tr>
      <td>{{ b.id }}</td>
      <td>{{ b.title }}</td>
      <td>{{ b.author }}</td>
      <td>{{ b.price }}</td>
      <td>{{ b.edition }}</td>
      <td>
        <a href="{% url 'p2_editbook' b.id %}">Edit</a> |
        <a href="{% url 'p2_deletebook' b.id %}" onclick="return confirm('Delete this book?');">Delete</a>
      </td>
    </tr>
  {% empty %}
    <tr><td colspan="6">No books</td></tr>
  {% endfor %}
</table>
{% endblock %}
